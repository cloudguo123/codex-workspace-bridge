[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-workspace-bridge"
version = "0.1.0"
description = "Local-first, evidence-based workspace and Codex continuity migration"
requires-python = ">=3.11"
license = {file = "LICENSE"}
readme = "README.md"
authors = [{name = "Codex Workspace Bridge contributors"}]
dependencies = []

[project.scripts]
workbridge = "workbridge.cli:main"

[tool.setuptools.packages.find]
include = ["workbridge*"]

[tool.setuptools.package-data]
workbridge = ["dashboard.html"]
